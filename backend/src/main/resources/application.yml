# ============================================================
# AI Job Pilot  - Application Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: job-pilot

  # ---- Virtual Threads (Java 21) ----
  threads:
    virtual:
      enabled: true

  # ---- Database ----
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobpilot}
    username: ${DB_USERNAME:jobpilot}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ---- Spring AI - OpenAI ----
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.7
      # Local Transformers Embedding
      embedding:
        transformer:
          onnx:
            enabled: true
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
        initialize-schema: false

# ---- JWT Configuration ----
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevOnlyChangeInProductionMustBe256BitsLong!!}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

  # ---- File Storage ----
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    allowed-types: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  # ---- CORS ----
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  # ---- SerpAPI ----
  serpapi:
    api-key: ${SERPAPI_KEY:4c51c08cd30051acf4def1668338d13e53e733f5d78b5b189fd74261cc76285f}
    base-url: https://serpapi.com

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---- Swagger/OpenAPI ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ---- Logging ----
logging:
  level:
    root: INFO
    com.jobpilot: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
