<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 300px; font-family: 'Inter', system-ui, sans-serif; padding: 0; margin: 0; background: #f8fafc; }
        .header { background: #0f172a; color: white; padding: 20px; text-align: center; }
        .logo { font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        .content { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:hover { background: #4338ca; }
        .status { font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡ Job Pilot </div>
        <div style="font-size: 10px; font-weight: bold; opacity: 0.6; letter-spacing: 1px;">BROWSER ASSISTANT</div>
    </div>
    <div class="content">
        <button id="toggle-btn" class="btn">Open Sidebar on Page</button>
        <div class="status">Visit a job page and click above to force-open the AI assist panel.</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
